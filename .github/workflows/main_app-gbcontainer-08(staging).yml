# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-08

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crkhs08.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B2F7A50EEFA348A08F97A07279B203E6 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_ABB39B971D8E4FB78513CF6F43A9CEE7 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crkhs08.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B2F7A50EEFA348A08F97A07279B203E6 }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-08'
          slot-name: 'staging'
          images: 'crkhs08.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B2F7A50EEFA348A08F97A07279B203E6 }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8EF4D4C7D52046D18886CF268A6D0EF9 }}